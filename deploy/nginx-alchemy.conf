# Alchemy Nginx（拷到 /etc/nginx/conf.d/alchemy.conf；Ubuntu / CentOS 都读 conf.d）
# 配套：
#   /etc/nginx/conf.d/cloudflare-realip.conf
#   /opt/alchemy/conf/nginx/locations.conf
# HTTPS 见 nginx-alchemy-ssl.conf
#
# 本机应用：./deploy/apply-nginx.sh

server {
    listen 80 default_server;
    server_name example.com _;
    charset utf-8;
    include /opt/alchemy/conf/nginx/locations.conf;
}

server {
    listen 80;
    server_name example.com;
    charset utf-8;
    include /opt/alchemy/conf/nginx/locations.conf;
}
