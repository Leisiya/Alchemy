# 由 server 块 include，路径：/opt/alchemy/conf/nginx/locations.conf
root /opt/alchemy/ui;
index index.html;

location = /index.html {
    add_header Cache-Control "no-store";
}

# ^~：前缀命中后不再走下面的 js/css 正则，否则 /prod-api/druid/*.js 会被当成前端静态文件 404，
# Druid 登录页的 Sign in 依赖 jquery，按钮会点了没反应。
location ^~ /prod-api/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:8080/;
}

location ~ ^/v3/api-docs/(.*) {
    proxy_pass http://127.0.0.1:8080/v3/api-docs/$1;
}

location ~* \.(?:js|css|png|jpe?g|gif|ico|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
}

location / {
    try_files $uri $uri/ /index.html;
}
