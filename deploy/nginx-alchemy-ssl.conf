# Alchemy HTTPS（拷到 /etc/nginx/conf.d/alchemy-ssl.conf）
# 证书默认是自签，配合 Cloudflare SSL「Full」。
# 换成 Cloudflare Origin CA 后可开 Full (strict)，覆盖：
#   /opt/alchemy/conf/tls/origin.crt
#   /opt/alchemy/conf/tls/origin.key
# 然后 nginx -t && nginx -s reload

server {
    listen 443 ssl http2;
    server_name example.com;
    charset utf-8;

    ssl_certificate     /opt/alchemy/conf/tls/origin.crt;
    ssl_certificate_key /opt/alchemy/conf/tls/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    include /opt/alchemy/conf/nginx/locations.conf;
}
