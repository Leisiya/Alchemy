<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title><%= webpackConfig.name %></title>
    <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      .app-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0D1B2A;
        background-image: radial-gradient(circle at 50% 0%, #1b3a5f 0%, #0D1B2A 60%);
        font-family: Helvetica Neue, Helvetica, PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif;
        text-align: center;
      }

      .app-splash__brand {
        margin: 0 0 8px;
        color: #ffffff;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 1px;
        line-height: 1.2;
      }

      .app-splash__tagline {
        margin: 0 0 32px;
        color: #94A3B8;
        font-size: 14px;
        line-height: 1.5;
      }

      .app-splash__spinner {
        box-sizing: border-box;
        width: 32px;
        height: 32px;
        border: 3px solid rgba(148, 163, 184, 0.22);
        border-top-color: #15803D;
        border-right-color: #15803D;
        border-radius: 50%;
        animation: app-splash-spin 800ms linear infinite;
      }

      .app-splash__hint {
        margin: 16px 0 0;
        color: #94A3B8;
        font-size: 12px;
        line-height: 1.5;
      }

      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-splash__spinner {
          animation: none;
          border-color: rgba(148, 163, 184, 0.28);
          border-top-color: #15803D;
          opacity: 0.85;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-splash" role="status" aria-live="polite" aria-busy="true">
        <p class="app-splash__brand">Alchemy</p>
        <p class="app-splash__tagline">A股价值投资好助手</p>
        <div class="app-splash__spinner" aria-hidden="true"></div>
        <p class="app-splash__hint">正在加载</p>
      </div>
    </div>
  </body>
</html>
